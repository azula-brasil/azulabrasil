<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joaquim Cleber | Azula Brasil</title>
    <style>
        /* Modern Dark Theme */
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-color: #ff9f43; /* Warm gold/orange for highlight */
            --sub-text: #b0b0b0;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 5rem 2rem;
            border-bottom: 2px solid #333;
        }

        h1 {
            font-size: 3rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--accent-color);
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Essential Navigation */
        nav {
            margin-top: 3rem;
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        nav a {
            color: var(--sub-text);
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 1rem;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #fff;
            text-decoration: underline;
        }

        /* Content Container */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 3rem;
        }

        /* Portfolio Sections */
        .section {
            margin-bottom: 7rem;
        }

        .section-title {
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 3rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #fff;
        }

        /* Dynamic Grid Layout */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
        }

        .portfolio-grid img {
            width: 100%;
            height: 400px; /* Consistent height for a powerful grid */
            object-fit: cover;
            object-position: center;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .portfolio-grid img:hover {
            transform: scale(1.05);
            cursor: pointer;
        }

        #canvases .portfolio-grid img,
        #tattoos .portfolio-grid img,
        #digital-art .portfolio-grid img {
            object-fit: contain;
            height: auto;
            background-color: transparent;
        }

        #digital-art .portfolio-grid {
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 2.5rem;
        }

        #digital-art .portfolio-grid img {
            height: auto;
        }

        /* Contact Area */
        .contact-section {
            text-align: center;
            padding: 5rem 2rem;
            background-color: #1a1a1a;
            border-radius: 8px;
            margin-top: 5rem;
        }

        .contact-text {
            max-width: 900px;
            margin: 0 auto 3rem;
            color: var(--sub-text);
            font-size: 1.2rem;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .whatsapp-btn {
            display: inline-block;
            padding: 15px 40px;
            background-color: var(--accent-color);
            color: #000;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 5px;
            letter-spacing: 1px;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .whatsapp-btn:hover {
            background-color: #fff;
            color: #000;
            transform: translateY(-3px);
        }

        .social-link {
            color: var(--sub-text);
            text-decoration: none;
            font-size: 1.1rem;
            margin-top: 10px;
            transition: color 0.3s;
        }

        .social-link:hover {
            color: #fff;
        }

        /* Minimal Footer */
        footer {
            text-align: center;
            padding: 3rem;
            border-top: 1px solid #333;
            font-size: 0.9rem;
            color: #666;
        }

        @media (max-width: 720px) {
            header {
                padding: 4rem 1.5rem;
            }

            h1 {
                font-size: 2.2rem;
                letter-spacing: 3px;
            }

            nav {
                flex-direction: column;
                gap: 1rem;
            }

            .container {
                padding: 2rem 1rem;
            }

            .portfolio-grid {
                grid-template-columns: 1fr;
            }

            .portfolio-grid img {
                height: 320px;
            }

            #digital-art .portfolio-grid {
                gap: 1.5rem;
            }

            #digital-art .portfolio-grid img {
                height: auto;
            }
        }

    </style>
</head>
<body>

    <header>
        <h1>AZULA BRASIL</h1>
        <p>Abstract Canvas • Custom Tattoos • Digital Art</p>
        <nav>
            <a href="#canvases">CANVAS</a>
            <a href="#tattoos">TATTOOS</a>
            <a href="#digital-art">DIGITAL ART</a>
        </nav>
    </header>

    <main class="container">

        <section id="canvases" class="section">
            <h2 class="section-title">Canvas</h2>
            <div class="portfolio-grid">
                <img src="canvas1.jpg" alt="Abstract painting on canvas" loading="lazy" decoding="async">
                <img src="canvas-tigre.png" alt="Painted tiger canvas" loading="lazy" decoding="async">
            </div>
        </section>

        <section id="tattoos" class="section">
            <h2 class="section-title">Tattoos</h2>
            <div class="portfolio-grid">
                <img src="IMG_0562.JPG" alt="Large modern canvas piece" loading="lazy" decoding="async">
                <img src="IMG_0563.JPG" alt="Tattoo artwork example" loading="lazy" decoding="async">
                <img src="IMG_0913.JPG" alt="Tattoo detail" loading="lazy" decoding="async">
                <img src="IMG_0560.JPG" alt="Custom tattoo design" loading="lazy" decoding="async">
                <img src="IMG_6787.jpg" alt="Custom tattoo design" loading="lazy" decoding="async">
            </div>
        </section>

        <section id="digital-art" class="section">
            <h2 class="section-title">Digital Art</h2>
            <div class="portfolio-grid">
                <img src="digital-art/3lei.png" alt="I deserve it all digital artwork" loading="lazy" decoding="async">
                <img src="digital-art/esu.png" alt="Exu digital artwork" loading="lazy" decoding="async">
                <img src="digital-art/gospel.png" alt="The Midnight Gospel digital artwork" loading="lazy" decoding="async">
                <img src="digital-art/iemanja.png" alt="Iemanja digital artwork" loading="lazy" decoding="async">
                <img src="digital-art/ogum.png" alt="Ogum digital artwork" loading="lazy" decoding="async">
                <img src="digital-art/osun.png" alt="Oxum digital artwork" loading="lazy" decoding="async">
                <img src="digital-art/oxossi.png" alt="Oxossi digital artwork" loading="lazy" decoding="async">
                <img src="digital-art/tiger.png" alt="Tiger digital artwork" loading="lazy" decoding="async">
                <img src="digital-art/war.png" alt="War digital artwork" loading="lazy" decoding="async">
            </div>
        </section>

        <section class="contact-section">
            <p class="contact-text">Para encomendas e comissões, entre em contato.</p>
            <div class="button-group">
                <a href="https://wa.me/5584999868090" target="_blank" class="whatsapp-btn">WhatsApp</a>
                <a href="https://instagram.com/azula.brasil" target="_blank" class="social-link">Instagram</a>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Azula Brasil. All rights reserved.</p>
    </footer>

</body>
</html>
